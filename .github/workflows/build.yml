name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepara progetto
        run: |
          unzip -q fit_simple.zip -d src
          flutter create --org com.example --project-name fit_simple --platforms=android app
          rm -rf app/lib
          cp -r src/fit_simple/lib app/lib
          cp src/fit_simple/pubspec.yaml app/pubspec.yaml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' app/android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' app/android/app/build.gradle || true
          f=$(find app/android -name MainActivity.kt)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$f"
          python3 - <<'PY'
          p = 'app/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('<application', '''<uses-permission android:name="android.permission.health.READ_STEPS"/>
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/>
              <queries><package android:name="com.google.android.apps.healthdata"/></queries>
              <application''', 1)
          s = s.replace('</activity>', '''<intent-filter><action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/></intent-filter>
              </activity>
              <activity-alias android:name="ViewPermissionUsageActivity" android:exported="true" android:targetActivity=".MainActivity" android:permission="android.permission.START_VIEW_PERMISSION_USAGE">
                <intent-filter>
                  <action android:name="android.intent.action.VIEW_PERMISSION_USAGE"/>
                  <category android:name="android.intent.category.HEALTH_PERMISSIONS"/>
                </intent-filter>
              </activity-alias>''', 1)
          open(p, 'w').write(s)
          PY
      - name: Compila
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fit-simple-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
